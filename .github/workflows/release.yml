name: Release

# Default mode is "prerelease" — every tag push (or workflow_dispatch run)
# produces the 9 variant APKs as Actions artifacts only. To cut a stable
# GitHub Release, run the workflow manually via Actions → Run workflow with
# the `stable` checkbox ticked. Tag-push triggers always run in prerelease
# (artifacts-only) mode.
#
# Version is derived in the build job's "Derive version" step:
#   - workflow_dispatch: from inputs.version (e.g. "1.0.0-631-pre1")
#   - push: tags: from GITHUB_REF_NAME stripped of leading "v"
# All downstream jobs reference needs.build.outputs.version (no leading "v")
# and needs.build.outputs.tag ("v" + version).
on:
  push:
    tags:
      - "v*"
      - "GameHub-*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for APK filenames + release tag (e.g. "1.0.0-631-pre1" or "1.0.0-631"). Strip leading v; the workflow re-adds it for the git tag. Required for workflow_dispatch.'
        required: false
      stable:
        description: "Cut a stable GitHub Release (default: artifact-only prerelease). Stable requires version to be set."
        type: boolean
        default: false

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        # Single source of truth for the version string used in APK filenames
        # AND the GitHub release tag. Stripped of any leading "v" so the patch
        # job can interpolate it directly into "BannerHub-V6-${version}-…".
        # The release job re-adds "v" when creating the git tag.
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            if [ -z "$RAW" ]; then
              echo "::error::version input is required for workflow_dispatch. Example: 1.0.0-631-pre1"
              exit 1
            fi
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version=${VERSION} tag=v${VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5

      # libevshim.so build step removed — the vibration patch is now
      # preload-free (in-process winebus.so disk patch via
      # BhVibrationController.ensureWinebusDurationPatchOnce). No native
      # shim is built or shipped; nothing is added to LD_PRELOAD.

      - name: Sync Explore What's New from release notes
        # Regenerates explore/bh_explore.json's hero "What's New" block from the
        # README "What's new in <ver>" section, so the in-app What's New matches
        # the release notes without hand-editing two places.
        # MUST run BEFORE "Stamp Explore version": that step mirrors the manifest
        # into patches/.../bh_explore.json (the baked-into-APK asset), so the body
        # has to be fresh first — otherwise the APK ships the new version/build
        # number with the PREVIOUS release's body. Fail-safe: leaves the manifest
        # untouched (exit 0) if the notes format changes.
        run: python3 explore/gen_whatsnew.py

      - name: Stamp Explore version
        # Writes the INSTALLED version into patches/.../explore/bh_version.json
        # (bundled into the APK by ExploreVersionAssetPatch as assets/bh_version.json)
        # AND the LATEST version into explore/bh_explore.json's root, then mirrors
        # the (already What's-New-synced) manifest into the baked APK asset. Runs
        # BEFORE the gradle build so the patch bundle picks up the freshly-stamped
        # asset. Fail-safe (exit 0) if the version can't be resolved.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: python3 explore/stamp_version.py

      - name: Build patches bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Download ReVanced CLI
        run: |
          curl -L https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar

      - name: Download base GameHub APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download base-apk-631 \
            --pattern "GameHub_6.3.1.apk" \
            --repo ${{ github.repository }} \
            --output GameHub_6.3.1.apk

      - name: Stage shared artifacts
        run: |
          mkdir -p shared
          cp revanced-cli.jar shared/
          cp GameHub_6.3.1.apk shared/
          cp $(find patches/build/libs -name "*.rvp" ! -name "*-javadoc*" ! -name "*-sources*" | head -1) shared/patches.rvp
          # Side-channel artefacts that ship in the final release
          cp patches/build/libs/*.rvp shared/ 2>/dev/null || true
          mkdir -p shared/rve
          find extensions/extension/build/libs -name "*.rve" -exec cp {} shared/rve/ \; 2>/dev/null || true
          # Live Explore manifest — attached as the bh_explore.json release asset
          # so installed apps fetch the latest stable's What's New / features via
          # releases/latest/download/bh_explore.json (see BhExploreManifest).
          cp explore/bh_explore.json shared/ 2>/dev/null || true

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v6
        with:
          name: shared
          path: shared/
          retention-days: 1

  patch:
    name: Patch ${{ matrix.variant.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # APK filename is computed in "Apply patches" from needs.build.outputs.version
        # + matrix.variant.name, so no per-variant `file:` column. Three labels share
        # the bare "BannerHub v6" tag (Normal, Normal-GHL, Original) — they install
        # side-by-side via different package names, same pattern as the two AnTuTu
        # variants which share "BannerHub v6 AnTuTu".
        variant:
          - { name: Normal,         pkg: "banner.hub",                 label: "BannerHub v6" }
          - { name: Normal-GHL,     pkg: "gamehub.lite",               label: "BannerHub v6" }
          - { name: PuBG,           pkg: "com.tencent.ig",             label: "BannerHub v6 PuBG" }
          - { name: AnTuTu,         pkg: "com.antutu.ABenchMark",      label: "BannerHub v6 AnTuTu" }
          - { name: alt-AnTuTu,     pkg: "com.antutu.benchmark.full",  label: "BannerHub v6 AnTuTu" }
          - { name: PuBG-CrossFire, pkg: "com.tencent.tmgp.cf",        label: "BannerHub v6 PuBG CrossFire" }
          - { name: Ludashi,        pkg: "com.ludashi.aibench",        label: "BannerHub v6 Ludashi" }
          - { name: Genshin,        pkg: "com.miHoYo.GenshinImpact",   label: "BannerHub v6 Genshin" }
          - { name: Original,       pkg: "com.xiaoji.egggame",         label: "BannerHub v6" }
    steps:
      - name: Checkout
        # Needed so the apksigner step can read keystore/bannerhub.keystore.
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download shared artifacts
        uses: actions/download-artifact@v7
        with:
          name: shared
          path: shared/

      - name: Apply patches
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          mkdir -p out
          # Values are wrapped in JSON-string quotes so picocli's
          # Map<String,Object> parser doesn't try to coerce them as
          # numbers (e.g. "com.tencent.tmgp.cf" — the trailing 'f' is
          # parsed as a Java float suffix and triggers NumberFormatException
          # before the patch ever runs). The quotes also make values with
          # spaces (e.g. "BannerHub v6 PuBG CrossFire") a non-issue.
          java -jar shared/revanced-cli.jar patch shared/GameHub_6.3.1.apk \
            --patches shared/patches.rvp \
            --bypass-verification \
            `# 610: "Strip cloud gaming" is broken on 6.1.0 (bytecode anchors gone) but its` \
            `# resource-delete dependency still runs and removes assets/composeResources/` \
            `# ...features.cloud, which 6.1.0 loads at STARTUP -> MissingResourceException crash.` \
            `# Disabled until the patch is re-derived / re-scoped for 6.1.0.` \
            -d "Strip cloud gaming" \
            -e "Change package name" \
              -O 'packageName="${{ matrix.variant.pkg }}"' \
              -O 'updatePermissions=true' \
              -O 'updateProviders=true' \
            -e "Change app name" -O 'appName="${{ matrix.variant.label }}"' \
            --out "out/${FILENAME}"
          ls -la "out/${FILENAME}"

      - name: Re-sign with BannerHub test key (v1+v2+v3)
        # Replaces revanced-cli's per-run ephemeral signature with the
        # checked-in BannerHub test keystore so the signing cert is stable
        # across releases. v1+v2+v3 enabled for maximum device coverage;
        # v4 disabled (would need a sidecar .idsig sibling for each APK).
        # Cert SHA-256 is printed to logs so we can eyeball-confirm the
        # cert never changed between runs (= in-place updates guaranteed).
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          echo "Using apksigner at ${APKSIGNER}"
          "${APKSIGNER}" sign \
            --ks keystore/bannerhub.keystore \
            --ks-pass pass:bannerhub \
            --ks-key-alias bannerhub \
            --key-pass pass:bannerhub \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "out/${FILENAME}"
          echo "=== signature verification ==="
          "${APKSIGNER}" verify --print-certs "out/${FILENAME}"

      - name: Upload variant APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.variant.name }}
          path: out/BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
          # 14 days so prerelease APKs are downloadable for testing
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, patch]
    # Only runs when explicitly opted in via workflow_dispatch with stable=true.
    # Every other trigger (tag push, workflow_dispatch with stable=false) ends
    # at the patch matrix and leaves the APKs as Actions artifacts.
    if: github.event_name == 'workflow_dispatch' && inputs.stable == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download shared artifacts (rvp + rve)
        uses: actions/download-artifact@v7
        with:
          name: shared
          path: shared/

      - name: Download all variant APKs
        uses: actions/download-artifact@v7
        with:
          pattern: apk-*
          path: apks/
          merge-multiple: true

      - name: List release files
        run: |
          echo "=== APKs ==="
          ls -la apks/
          echo "=== rvp ==="
          ls -la shared/*.rvp 2>/dev/null || true
          echo "=== rve ==="
          ls -la shared/rve/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: BannerHub v6 ${{ needs.build.outputs.version }}
          # Slim release-notes template. Each stable: refresh the "What's new in ..."
          # section below for the changes since the prior stable (base bumps + new features).
          body: |
            ## BannerHub v6 ${{ needs.build.outputs.version }}

            > ⚠️ **Read before installing — USE AT YOUR OWN RISK.** BannerHub v6 is a **separate project** from BannerHub 3.7.x and BannerHub Lite (own package names, keystore, and backend) — they do **not** update over one another, and v6 is a **work in progress, barely tested**, with different game compatibility. Full details below. ⤵

            <details>
            <summary><strong>⚠️ Important — separate projects &amp; compatibility (click to expand)</strong></summary>

            **BannerHub v6 does NOT replace BannerHub 3.7.x or BannerHub Lite — they are SEPARATE projects.**

            - **BannerHub** 3.7.x — built from the GameHub 5.3.5 ReVanced project by **PlayDay**.
            - **BannerHub Lite** — built from GameHub Lite 5.1.4 by **Producdevity**.
            - **BannerHub v6** *(this repo)* — built from XiaoJi GameHub 6.0.x on a brand-new pipeline.

            **None of the three are to be updated over by any of the others.** Each ships with its own package names, its own keystore, and its own component / Steam-client backend — Android won't accept an in-place update between them, and forcing one will leave you with a broken install. Uninstall first, then install the new project if you want to switch.

            Keep in mind **BannerHub v6 is still a work in progress** and will re-release frequently as new base GameHub versions come out from XiaoJi upstream. **Compatibility is different** — don't expect every game that works on BannerHub 3.7.x or Lite to work on v6, and vice versa. v6 uses a **new component system and new Steam clients** and, thus far, has been **barely tested in general**.

            **USE AT YOUR OWN RISK.**

            </details>

            A patched build of **XiaoJi GameHub 6.3.1** that removes the login requirement (import and play games with no account), serves **its own PC Engine plugin**, and redirects the catalog + firmware to the BannerHub Cloudflare Worker. Ships **9 variants that install side-by-side**.

            **9 APKs attached.** Steam and GOG game launches work end-to-end on the 6.3.1 base.

            > **No separate Lite builds.** XiaoJi's own size pass plus the privacy/size strips folded into every variant make a distinct Lite pointless — the Lite concept stays absorbed.

            🔒 **Privacy-hardened** — upstream telemetry/analytics channels stripped at the bytecode level. Full list of killed channels (and the honest leftovers) in [`PRIVACY.md`](https://github.com/${{ github.repository }}/blob/gamehub-631-build/PRIVACY.md).

            <details>
            <summary><strong>✨ Everything BannerHub v6 offers (click to expand)</strong></summary>

            - **No login required** — launch straight to the home screen and import/play games without a XiaoJi account (on 6.3.1 a synthetic account is seeded so the PC Engine plugin is happy too).
            - **BannerHub-served PC Engine plugin** — the 6.1+ runtime plugin is re-signed and patched by BannerHub and delivered from the BannerHub API; catalog and firmware go through the Worker, firmware downloads are forced to HTTP/1.1, the launch badge is back.
            - **Custom catalog API** — **curated component delivery** (hand-picked DXVK, VKD3D-Proton, Box64, FEX, Mesa Turnip driver builds, etc.) instead of the stock upstream set.
            - **Component Manager** *(new)* — inject your own `.wcp` components or GPU-driver `.zip`s, or download them from the online repos, and use them from the normal pickers; remove in one tap.
            - **Full GOG store** *(new)* — Store / Library / Downloads / Profile, catalog browse + search, detail pages with media, Bannerlator's Rust download engine.
            - **Privacy-hardened** — upstream telemetry/analytics channels stripped at the bytecode level (see the `PRIVACY.md` link above for the full list).
            - **PC-accurate controller vibration** — real XInput rumble routed into Android's VibratorManager with independent dual-motor support, configurable **per-game** via the **PC Vibration Settings** menu row. Preload-free.
            - **In-game Steam · Friends overlay** — friends list, chat and invites from inside the game, now over a main-process relay that suits the plugin architecture.
            - **BannerHub Explore homepage** — the bottom-nav "Explore" tab opens a BannerHub-owned homepage: "What's New" synced from the release notes, the GOG store card, Banner Tools, and an in-app **update banner + installed-vs-latest version readout**.
            - **In-game performance HUD + overlay** *(root for the clock controls)* — live DXVK/GPU/CPU/RAM/power/thermal/FPS readout and a slide-out panel for governor + Adreno clock toggles.
            - **9 side-by-side variants** — different package names + launcher labels so multiple builds coexist on one device (`Original` replaces stock GameHub; the rest install alongside it).
            - **Root-free file manager access** — a content provider lets MT Manager and similar apps browse GameHub's data dir without root.
            - **Installs in place** — public signing keystore; BannerHub v6 stables upgrade without uninstalling (see the 6.0.9 → 6.3.1 note below).
            - **BannerHub v6 branding** — custom app icon, Wine container header, and auth/splash artwork.
            - **Triage-friendly** — debuggable build with logcat markers along the import path.

            </details>

            ## What's new in ${{ needs.build.outputs.version }}

            1.0.2 and 1.0.1 are fix releases on the 6.3.1 line (details first below). The 631 headline: **BannerHub v6 now runs on XiaoJi GameHub 6.3.1** (versionCode 141), up from the 6.0.9 base (versionCode 121) of `v1.0.0-609`. Since 6.1.0 the whole Wine runtime, launch screen and component system live in a separately-downloaded **PC Engine plugin**, and 6.3.x added XiaoJi's community/social layer, a newer Steam stack and transactional cloud sync. Every BannerHub patch was **re-derived against 6.3.1 and confirmed on-device**, and the plugin side is now BannerHub's too.

            ### 🩹 1.0.2-631 — install conflict when upgrading from 609 (or next to stock GameHub)

            Fixes **"App not installed as package conflicts with an existing package"** when installing a 631 build over `v1.0.0-609`, or on any device that also has **stock GameHub 6.1+** (or another GameHub 6.x mod signed with a different key). The 6.1+ base declares a new push permission, `com.xiaoji.egggame.push.permission.MESSAGE`, outside the name pattern our per-variant rename covered, so every 631 variant still declared it under XiaoJi's name — and Android refuses to install a package that redeclares a permission owned by a differently-signed app. Every `com.xiaoji.egggame.*` permission is now renamed per variant (declarations, requests, and the two receiver guards). Device-proven: 609 → 1.0.2 in place. Same plugin (111-7), same firmware, same keystore. Nothing else changed since 1.0.1-631.

            ### 🩹 1.0.1-631 — Component Manager removal fixes

            Two bugs found right after 1.0.0-631, both in the remove → re-inject path:

            - **Removing a component no longer breaks the games that used it.** The PC Engine wires the selected translator / DXVK into each game prefix as symlinks and never re-points an existing one, so after a Remove those links dangled and the game died on launch (`could not load libarm64ec_import.dll`, Wine exit 53). Remove — and opening Component Manager — now clears dead links; the engine plants fresh ones on the next launch.
            - **Re-injecting a component you removed no longer claims it "already exists".** The name check read a stale in-process copy of the plugin registry; it now reads the registry file fresh, tells catalog rows from injected ones, and silently heals an orphaned row instead of prompting.

            Device-proven: inject → use → remove → re-inject (no prompt) → launch. Nothing else changed since 1.0.0-631; same plugin (111-7), same firmware, same keystore — installs in place.

            ### 🔁 Rebased onto GameHub 6.3.1 (versionCode 141)

            The 6.1.0 and 6.1.1 lines were onboarded but never shipped as stables; 6.3.1 is where everything landed. The usual R8 reshuffle broke most anchors; all were re-derived structurally — the per-game menu keystone first, then the Banner Tools row, Show PC Game Settings, Bypass login, Debug logging, the Explore tab hijack, the catalog + `/v6` redirects, the perf overlay, the vibration resolver and the privacy strips. Two obsolete PC-engine signature patches were retired.

            ### 🔌 BannerHub-served PC Engine plugin

            The host downloads a **PC Engine plugin** (schema 7 on 6.3.1) and only accepts what its manifest names. BannerHub v6 serves **its own re-signed, patched 6.3.1 plugin** from the BannerHub API: catalog + firmware via the Worker (`/v6p`), firmware forced to HTTP/1.1 (upstream's downloader corrupted imagefs over multiplexed HTTP/2), the launch badge restored, and loader hooks so host-injected components appear in every picker. Plugin updates arrive automatically on app start. Firmware stays pinned at 1.4.2 and **no previously released BannerHub or v6 build is affected**.

            ### 🛒 Full GOG store with the Rust download engine

            GOG login is fixed (no more white screen after sign-in) and the GOG screen is now a **full store** ported from Bannerlator: Store / Library / Downloads / Profile tabs, catalog browse + search, Steam-style detail pages with media, generation badges from GOG's content system, and downloads on Bannerlator's **Rust engine** with staged, verified chunked transfers (57 MB/s measured on device). Games land in your library and launch like any other PC game.

            ### 🧩 Component Manager — inject your own components

            New **Components** tile in Banner Tools, at parity with BannerHub 3.8.1's injector: inject any `.wcp` (DXVK, VKD3D, FEX/Box64 translators, libs; tar + zstd / xz) or a GPU-driver `.zip` from storage, or pull them from the same six online repos plus the Turnip Nightlies from a **Download** screen. Injected components register with the plugin, appear in the right picker next to the catalog, and are removable in one tap. Device-proven end-to-end: a game ran on an injected Turnip driver, an injected DXVK and an injected FEX nightly simultaneously; removal leaves no ghost entries.

            ### 💬 Steam · Friends overlay rebuilt for the plugin era

            The game now runs inside the plugin process, so the overlay has a new transport: a relay service in the main app process (attaches in ~130 ms) with an IPC fallback for invites, and it never blocks the UI thread. Steam sign-in, the Friends list and online play are confirmed on 6.3.1; **chat send/receive and voice calls have not been re-verified on this base yet**.

            ### 🔐 Login bypass that survives the plugin

            The plugin reads the signed-in user from the Room database, so Bypass login **seeds a synthetic account** through Room's bundled SQLite driver. Clean install → first launch → game running with no account is confirmed. The heartbeat/token calls that used to log the fake account out are answered by the Worker.

            ### Carryover — what still works, what is paused

            Explore tab, Banner Tools (**Vibration · Game ID · Audio · GOG · Overlay · Root · Components**), the in-game performance HUD + root pill, PC-accurate vibration, the privacy stack, the 9 variants and the public keystore carry over. **Paused on 6.3.1** (host anchors gone): the **offline component picker** (the plugin owns the pickers now) and the **recording-compatible audio** toggle (the Audio tile is present; that switch does nothing on this base). The heartbeat-disable patch is moot since the Worker handles heartbeat.

            > ⚠️ **Upgrading from `v1.0.0-609`:** same signing key, so Android accepts an in-place update, but the 6.0.9 → 6.3.1 database migration is XiaoJi's and **we have not tested it**. A clean install is recommended; sign in to Steam and GOG again afterwards.

            <details>
            <summary><strong>📥 Variants &amp; install notes (9 side-by-side APKs)</strong></summary>

            Each variant has its own package name + launcher label, so the variants install **side-by-side** with each other. `Original` replaces an installed GameHub; the rest install alongside it. If a package name is already on your device under a different signing key (e.g. `com.tencent.ig` used by another emulator build), Android reports a package conflict — pick a different variant.

            | Variant | Package | APK |
            | --- | --- | --- |
            | Normal | `banner.hub` | `…-Normal.apk` |
            | Normal-GHL | `gamehub.lite` | `…-Normal-GHL.apk` |
            | PuBG | `com.tencent.ig` | `…-PuBG.apk` |
            | AnTuTu | `com.antutu.ABenchMark` | `…-AnTuTu.apk` |
            | alt-AnTuTu | `com.antutu.benchmark.full` | `…-alt-AnTuTu.apk` |
            | PuBG-CrossFire | `com.tencent.tmgp.cf` | `…-PuBG-CrossFire.apk` |
            | Ludashi | `com.ludashi.aibench` | `…-Ludashi.apk` |
            | Genshin | `com.miHoYo.GenshinImpact` | `…-Genshin.apk` |
            | Original | `com.xiaoji.egggame` | `…-Original.apk` |

            Filenames follow `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-{variant}.apk`. The version string is `BannerHub v6` (product) + our semver + `-631` (the GameHub base, `6.3.1`) — e.g. `${{ needs.build.outputs.version }}`.

            ### Install notes

            - **Signing**: public BannerHub test keystore, unchanged since `v1.1.0-604`. Fingerprints in [`keystore/README.md`](https://github.com/${{ github.repository }}/blob/gamehub-631-build/keystore/README.md).
            - **First launch needs network**: the app downloads the BannerHub PC Engine plugin (~27 MB) and, on first game launch, the firmware.
            - Base APK is unmodified XiaoJi GameHub 6.3.1 (versionCode 141) — only the bytecode/resources the patches need are touched.
            - The `.rvp` / `.rve` bundles are attached for use with `revanced-cli` directly. Built with ReVanced CLI 6.0.0; APKs from `gamehub-631-build`.

            </details>

            <details>
            <summary><strong>📦 Patches applied (click to expand)</strong></summary>

            | Patch | What it does |
            | --- | --- |
            | **Bypass login** | Launch straight to the home screen; import and play games with no account. On 6.3.1 also seeds the synthetic account into Room so the PC Engine plugin accepts downloads. |
            | **Redirect PC engine plugin manifest** | Points the plugin manifest lookup at the BannerHub API, which serves the BannerHub-patched plugin per schema version. |
            | **PC engine plugin — validation strategy** | Lets the host accept the BannerHub-signed plugin. |
            | **Redirect catalog API** + **Prefix API path with /v6** | Points the catalog at the BannerHub Worker without affecting 5.x clients; also fixes PC-settings rendering in portrait. |
            | **Component Manager** | Banner Tools → Components: inject `.wcp` / driver `.zip`, online-repo Download screen, list + remove; registers with the plugin. |
            | **GOG store + Rust engine** | Full GOG store UI, fixed login WebView, bundled `libblsteam.so` download engine. |
            | **Steam · Friends relay service** + **Steam chat overlay** | Main-process relay + invite IPC so the in-game overlay works with the plugin-hosted game. |
            | **Disable Firebase Crashlytics** | Prevents a launch-time `VerifyError` crash. |
            | **Debug logging** | Debuggable APK + logcat markers along the import path for triage. |
            | **File manager access** | Content provider so external file managers can browse the data dir without root. |
            | **Rewrite custom permissions per variant** | Stops two installed variants colliding on Android 7+. |
            | **PC-accurate vibration** + **PC Vibration Settings** | XInput rumble into Android's VibratorManager (independent dual-motor), per-game mode + intensity, strict per-game store. |
            | **Show PC Game Settings row** | Keeps the per-game **PC game settings** row visible in Explorer view. |
            | **Explore tab hijack** | The BannerHub Explore homepage. |
            | **Performance HUD / overlay** | In-game readout + root clock controls. |
            | **Privacy hardening** | Upstream telemetry/analytics channels stripped at the bytecode level. Full list + honest leftovers in `PRIVACY.md`. |
            | **Change app icon** / **Change package & app name** *(per variant)* | BannerHub v6 branding; per-variant package + launcher label. |
            | **Privacy/size strips** | Removes the Aliyun carrier-login (NumberAuth) SDK and the Haima cloud-gaming stack from every variant. |
            | *Paused on 6.3.1* | **Offline component picker**, **Recording-compatible audio**, **Disable heartbeat** — host anchors gone; kept in the tree, gated off. |

            *Per-patch mechanics, smali anchors, and version-by-version letter maps are in the [README's Patches applied section](https://github.com/${{ github.repository }}/blob/gamehub-631-build/README.md#patches-applied) and the [patch sources](https://github.com/${{ github.repository }}/tree/gamehub-631-build/patches/src/main/kotlin/app/revanced/patches/gamehub).*

