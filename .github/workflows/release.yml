name: Release

# Default mode is "prerelease" — every tag push (or workflow_dispatch run)
# produces the 9 variant APKs as Actions artifacts only. To cut a stable
# GitHub Release, run the workflow manually via Actions → Run workflow with
# the `stable` checkbox ticked. Tag-push triggers always run in prerelease
# (artifacts-only) mode.
#
# Version is derived in the build job's "Derive version" step:
#   - workflow_dispatch: from inputs.version (e.g. "1.1.0-604-pre1")
#   - push: tags: from GITHUB_REF_NAME stripped of leading "v"
# All downstream jobs reference needs.build.outputs.version (no leading "v")
# and needs.build.outputs.tag ("v" + version).
on:
  push:
    tags:
      - "v*"
      - "GameHub-*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for APK filenames + release tag (e.g. "1.1.0-604-pre1" or "1.1.0-604"). Strip leading v; the workflow re-adds it for the git tag. Required for workflow_dispatch.'
        required: false
      stable:
        description: "Cut a stable GitHub Release (default: artifact-only prerelease). Stable requires version to be set."
        type: boolean
        default: false

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        # Single source of truth for the version string used in APK filenames
        # AND the GitHub release tag. Stripped of any leading "v" so the patch
        # job can interpolate it directly into "BannerHub-V6-${version}-…".
        # The release job re-adds "v" when creating the git tag.
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            if [ -z "$RAW" ]; then
              echo "::error::version input is required for workflow_dispatch. Example: 1.1.0-604-pre1"
              exit 1
            fi
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version=${VERSION} tag=v${VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build libevshim.so (guest-side SDL rumble keepalive)
        # Compiles the native LD_PRELOAD shim that re-issues SDL_JoystickRumble
        # every 500ms so SDL2's 1s rumble_expiration auto-stop never fires.
        # Output is staged into patches/src/main/resources/lib/arm64-v8a/ so
        # the gradle build below bakes it into the .rvp, where the
        # VibrationLibPatch resource patch reads it back out at patch time.
        run: |
          set -e
          NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            NDK_HOME=$(ls -d "${ANDROID_SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            NDK_HOME="${ANDROID_SDK_ROOT}/ndk-bundle"
          fi
          echo "Using NDK: $NDK_HOME"
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build
          fi
          cmake -S native/evshim -B build/evshim \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          ninja -C build/evshim
          mkdir -p patches/src/main/resources/lib/arm64-v8a
          cp build/evshim/libevshim.so patches/src/main/resources/lib/arm64-v8a/libevshim.so
          chmod 0755 patches/src/main/resources/lib/arm64-v8a/libevshim.so
          file patches/src/main/resources/lib/arm64-v8a/libevshim.so

      - name: Build patches bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Download ReVanced CLI
        run: |
          curl -L https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar

      - name: Download base GameHub APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download base-apk-604 \
            --pattern "GameHub_6.0.4.apk" \
            --repo ${{ github.repository }} \
            --output GameHub_6.0.4.apk

      - name: Stage shared artifacts
        run: |
          mkdir -p shared
          cp revanced-cli.jar shared/
          cp GameHub_6.0.4.apk shared/
          cp $(find patches/build/libs -name "*.rvp" ! -name "*-javadoc*" ! -name "*-sources*" | head -1) shared/patches.rvp
          # Side-channel artefacts that ship in the final release
          cp patches/build/libs/*.rvp shared/ 2>/dev/null || true
          mkdir -p shared/rve
          find extensions/extension/build/libs -name "*.rve" -exec cp {} shared/rve/ \; 2>/dev/null || true

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/
          retention-days: 1

  patch:
    name: Patch ${{ matrix.variant.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # APK filename is computed in "Apply patches" from needs.build.outputs.version
        # + matrix.variant.name, so no per-variant `file:` column. Three labels share
        # the bare "BannerHub v6" tag (Normal, Normal-GHL, Original) — they install
        # side-by-side via different package names, same pattern as the two AnTuTu
        # variants which share "BannerHub v6 AnTuTu".
        variant:
          - { name: Normal,         pkg: "banner.hub",                 label: "BannerHub v6" }
          - { name: Normal-GHL,     pkg: "gamehub.lite",               label: "BannerHub v6" }
          - { name: PuBG,           pkg: "com.tencent.ig",             label: "BannerHub v6 PuBG" }
          - { name: AnTuTu,         pkg: "com.antutu.ABenchMark",      label: "BannerHub v6 AnTuTu" }
          - { name: alt-AnTuTu,     pkg: "com.antutu.benchmark.full",  label: "BannerHub v6 AnTuTu" }
          - { name: PuBG-CrossFire, pkg: "com.tencent.tmgp.cf",        label: "BannerHub v6 PuBG CrossFire" }
          - { name: Ludashi,        pkg: "com.ludashi.aibench",        label: "BannerHub v6 Ludashi" }
          - { name: Genshin,        pkg: "com.miHoYo.GenshinImpact",   label: "BannerHub v6 Genshin" }
          - { name: Original,       pkg: "com.xiaoji.egggame",         label: "BannerHub v6" }
    steps:
      - name: Checkout
        # Needed so the apksigner step can read keystore/bannerhub.keystore.
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Apply patches
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          mkdir -p out
          # Values are wrapped in JSON-string quotes so picocli's
          # Map<String,Object> parser doesn't try to coerce them as
          # numbers (e.g. "com.tencent.tmgp.cf" — the trailing 'f' is
          # parsed as a Java float suffix and triggers NumberFormatException
          # before the patch ever runs). The quotes also make values with
          # spaces (e.g. "BannerHub v6 PuBG CrossFire") a non-issue.
          java -jar shared/revanced-cli.jar patch shared/GameHub_6.0.4.apk \
            --patches shared/patches.rvp \
            --bypass-verification \
            -e "Change package name" \
              -O 'packageName="${{ matrix.variant.pkg }}"' \
              -O 'updatePermissions=true' \
              -O 'updateProviders=true' \
            -e "Change app name" -O 'appName="${{ matrix.variant.label }}"' \
            --out "out/${FILENAME}"
          ls -la "out/${FILENAME}"

      - name: Re-sign with BannerHub test key (v1+v2+v3)
        # Replaces revanced-cli's per-run ephemeral signature with the
        # checked-in BannerHub test keystore so the signing cert is stable
        # across releases. v1+v2+v3 enabled for maximum device coverage;
        # v4 disabled (would need a sidecar .idsig sibling for each APK).
        # Cert SHA-256 is printed to logs so we can eyeball-confirm the
        # cert never changed between runs (= in-place updates guaranteed).
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          echo "Using apksigner at ${APKSIGNER}"
          "${APKSIGNER}" sign \
            --ks keystore/bannerhub.keystore \
            --ks-pass pass:bannerhub \
            --ks-key-alias bannerhub \
            --key-pass pass:bannerhub \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "out/${FILENAME}"
          echo "=== signature verification ==="
          "${APKSIGNER}" verify --print-certs "out/${FILENAME}"

      - name: Upload variant APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant.name }}
          path: out/BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
          # 14 days so prerelease APKs are downloadable for testing
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, patch]
    # Only runs when explicitly opted in via workflow_dispatch with stable=true.
    # Every other trigger (tag push, workflow_dispatch with stable=false) ends
    # at the patch matrix and leaves the APKs as Actions artifacts.
    if: github.event_name == 'workflow_dispatch' && inputs.stable == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download shared artifacts (rvp + rve)
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Download all variant APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: apks/
          merge-multiple: true

      - name: List release files
        run: |
          echo "=== APKs ==="
          ls -la apks/
          echo "=== rvp ==="
          ls -la shared/*.rvp 2>/dev/null || true
          echo "=== rve ==="
          ls -la shared/rve/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: BannerHub v6 ${{ needs.build.outputs.version }}
          body: |
            ## BannerHub v6 ${{ needs.build.outputs.version }}

            A patched build of XiaoJi GameHub 6.0.4 (`com.xiaoji.egggame`, versionCode 114) that removes the login requirement so games can be imported and used without an account, redirects the catalog API to the BannerHub Cloudflare Worker, and ships **9 variants that install side-by-side on the same device**.

            ### 🔐 Stable signing — in-place updates from this release onward

            BannerHub releases are now signed with a **stable test keystore** ([`keystore/bannerhub.keystore`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/keystore/README.md)) instead of a fresh per-run ephemeral key. From this release forward, every future BannerHub v6 stable installs **on top of the previous one** with no uninstall — Android sees them as the same app.

            **One-time migration from any earlier `v1.0.0-604`-or-older release:** the old builds were signed with revanced-cli's per-run ephemeral key, so the cert differs. Uninstall your current BannerHub-ReVanced variant once, then install the matching variant from this release. From here on out you can update in place.

            Cert fingerprints (SHA-256 / SHA-1) are documented in [`keystore/README.md`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/keystore/README.md) and printed in every CI run's `apksigner verify --print-certs` log lines so you can cross-check.

            ### ✅ Steam game launches work end-to-end

            v1.0.0-602's release notes carried a warning that the **standard Steam client** wouldn't launch games under the BannerHub catalog redirect — the workaround was to switch to the **Lightweight Steam client** in the per-game settings. **That warning no longer applies.** The BannerHub API Worker has been fixed server-side to serve a Steam-launch-compatible payload for both client variants, so the standard Steam client launches games successfully on this build (and on existing patched builds — the fix is server-side and retroactive). Pick whichever Steam client suits your title; both work.

            > ⚠ **If your first Steam launch errors with `xtask install components failed`:** open that game's **PC game settings**, set the components manually (Wine prefix, DXVK, VKD3D, container, etc.) and — most importantly — make sure the **correct Steam client** is selected, then try to launch again. The error is a one-time setup hiccup on the first launch when components haven't been pinned per-game yet; once the per-game settings are filled in the launch succeeds.

            ### Source
            - **Base APK**: `GameHub_6.0.4.apk` — the official 6.0.4 global build (versionCode 114), attached unmodified to [`base-apk-604`](https://github.com/${{ github.repository }}/releases/tag/base-apk-604).
            - **Patcher**: ReVanced CLI 6.0.0 + this repo's patch bundle, branch `gamehub-604-build`.
            - **Catalog backend**: [`The412Banner/bannerhub-api`](https://github.com/The412Banner/bannerhub-api) — Cloudflare Worker, deployed at `bannerhub-api.the412banner.workers.dev`.
            - **Repo**: https://github.com/${{ github.repository }}

            ### Variants

            Nine APKs are produced from the same patch bundle, each with a different package name + launcher label so they install side-by-side. The `Original` variant **replaces** an installed GameHub; the rest install **alongside** the original.

            | Variant | APK | Package | Launcher label |
            | --- | --- | --- | --- |
            | Normal | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Normal.apk` | `banner.hub` | BannerHub v6 |
            | Normal-GHL | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Normal-GHL.apk` | `gamehub.lite` | BannerHub v6 |
            | PuBG | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-PuBG.apk` | `com.tencent.ig` | BannerHub v6 PuBG |
            | AnTuTu | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-AnTuTu.apk` | `com.antutu.ABenchMark` | BannerHub v6 AnTuTu |
            | alt-AnTuTu | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-alt-AnTuTu.apk` | `com.antutu.benchmark.full` | BannerHub v6 AnTuTu |
            | PuBG-CrossFire | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-PuBG-CrossFire.apk` | `com.tencent.tmgp.cf` | BannerHub v6 PuBG CrossFire |
            | Ludashi | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Ludashi.apk` | `com.ludashi.aibench` | BannerHub v6 Ludashi |
            | Genshin | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Genshin.apk` | `com.miHoYo.GenshinImpact` | BannerHub v6 Genshin |
            | Original | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Original.apk` | `com.xiaoji.egggame` | BannerHub v6 |

            ### Patches applied

            | Patch | What it does |
            | --- | --- |
            | **Bypass login** | Lets you launch straight into the home screen and import games without an account. |
            | **Disable Firebase Crashlytics** | Removes the Crashlytics init block so the patched build doesn't crash on launch with `VerifyError`. |
            | **Debug logging** | Marks the APK debuggable and adds logcat markers along the import code path for triage. |
            | **File manager access** | Exposes a content provider so external file managers (MT Manager etc.) can browse GameHub's data dir without root. |
            | **Rewrite custom permissions per variant** | Per-variant `com.xiaoji.egggame.permission.*` rewrite so two installed variants don't collide on Android 7+. |
            | **Mute UI sounds** | Replaces the bundled menu/button click sounds with silent PCM. Game audio is untouched. |
            | **Redirect catalog API** | Points the catalog API at the BannerHub Cloudflare Worker (`bannerhub-api.the412banner.workers.dev`) for curated component delivery. Side benefit: per-game PC settings now render in both landscape and portrait. |
            | **Prefix API path with /v6** | Prepends `v6/` to every relative API call so the Worker can serve 6.0-only response variants without affecting 5.x clients. |
            | **Offline component cache fallback** ⚠ *currently broken on 6.0.4* | *Intended to let per-game pickers show your cached components when the device is offline.* Online behavior is unchanged, so this caveat only matters when you're offline — pickers will still show only the embedded built-in versions instead of the cached entries the patch was meant to surface. Investigation pending; safe to ignore unless you specifically rely on offline picker contents. |
            | **Change package name** *(per variant)* | Renames the APK package per variant so all 9 variants install side-by-side. The `Original` variant keeps `com.xiaoji.egggame`. |
            | **Change app name** *(per variant)* | Renames the launcher label per variant. |

            *Per-patch mechanics, smali edits, structural anchors, and version-by-version letter maps live in the [README's Patches applied section](https://github.com/${{ github.repository }}/blob/gamehub-604-build/README.md#patches-applied) and the patch source comments under [`patches/src/main/kotlin/app/revanced/patches/gamehub/`](https://github.com/${{ github.repository }}/tree/gamehub-604-build/patches/src/main/kotlin/app/revanced/patches/gamehub).*

            ### Notes

            - The base APK is unmodified XiaoJi GameHub 6.0.4; only the bytecode/resources required by the patches above are touched.
            - **Signing**: signed with the stable BannerHub test keystore (`keystore/bannerhub.keystore`). One-time uninstall required if upgrading from `v1.0.0-604` or older (different cert). From this release onward, all future BannerHub v6 stables install in place. Cert fingerprints: see [`keystore/README.md`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/keystore/README.md).
            - Cover-art-on-import was fixed server-side in the BannerHub Worker on 2026-05-11 (worker deploy `5fd6c6a7…`) and applies retroactively to every existing patched build — no APK rebuild needed.
            - The `.rvp` patch bundle and `.rve` extension files are also attached for use with `revanced-cli` directly.
          files: |
            apks/BannerHub-V6-*.apk
            shared/*.rvp
            shared/rve/*.rve
