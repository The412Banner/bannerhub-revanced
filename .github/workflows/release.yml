name: Release

# Default mode is "prerelease" — every tag push (or workflow_dispatch run)
# produces the 9 variant APKs as Actions artifacts only. To cut a stable
# GitHub Release, run the workflow manually via Actions → Run workflow with
# the `stable` checkbox ticked. Tag-push triggers always run in prerelease
# (artifacts-only) mode.
#
# Version is derived in the build job's "Derive version" step:
#   - workflow_dispatch: from inputs.version (e.g. "1.1.0-604-pre1")
#   - push: tags: from GITHUB_REF_NAME stripped of leading "v"
# All downstream jobs reference needs.build.outputs.version (no leading "v")
# and needs.build.outputs.tag ("v" + version).
on:
  push:
    tags:
      - "v*"
      - "GameHub-*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for APK filenames + release tag (e.g. "1.1.0-604-pre1" or "1.1.0-604"). Strip leading v; the workflow re-adds it for the git tag. Required for workflow_dispatch.'
        required: false
      stable:
        description: "Cut a stable GitHub Release (default: artifact-only prerelease). Stable requires version to be set."
        type: boolean
        default: false

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        # Single source of truth for the version string used in APK filenames
        # AND the GitHub release tag. Stripped of any leading "v" so the patch
        # job can interpolate it directly into "BannerHub-V6-${version}-…".
        # The release job re-adds "v" when creating the git tag.
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            if [ -z "$RAW" ]; then
              echo "::error::version input is required for workflow_dispatch. Example: 1.1.0-604-pre1"
              exit 1
            fi
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version=${VERSION} tag=v${VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      # libevshim.so build step removed — the vibration patch is now
      # preload-free (in-process winebus.so disk patch via
      # BhVibrationController.ensureWinebusDurationPatchOnce). No native
      # shim is built or shipped; nothing is added to LD_PRELOAD.

      - name: Build patches bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Download ReVanced CLI
        run: |
          curl -L https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar

      - name: Download base GameHub APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download base-apk-604 \
            --pattern "GameHub_6.0.4.apk" \
            --repo ${{ github.repository }} \
            --output GameHub_6.0.4.apk

      - name: Stage shared artifacts
        run: |
          mkdir -p shared
          cp revanced-cli.jar shared/
          cp GameHub_6.0.4.apk shared/
          cp $(find patches/build/libs -name "*.rvp" ! -name "*-javadoc*" ! -name "*-sources*" | head -1) shared/patches.rvp
          # Side-channel artefacts that ship in the final release
          cp patches/build/libs/*.rvp shared/ 2>/dev/null || true
          mkdir -p shared/rve
          find extensions/extension/build/libs -name "*.rve" -exec cp {} shared/rve/ \; 2>/dev/null || true

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/
          retention-days: 1

  patch:
    name: Patch ${{ matrix.variant.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # APK filename is computed in "Apply patches" from needs.build.outputs.version
        # + matrix.variant.name, so no per-variant `file:` column. Three labels share
        # the bare "BannerHub v6" tag (Normal, Normal-GHL, Original) — they install
        # side-by-side via different package names, same pattern as the two AnTuTu
        # variants which share "BannerHub v6 AnTuTu".
        variant:
          - { name: Normal,         pkg: "banner.hub",                 label: "BannerHub v6" }
          - { name: Normal-GHL,     pkg: "gamehub.lite",               label: "BannerHub v6" }
          - { name: PuBG,           pkg: "com.tencent.ig",             label: "BannerHub v6 PuBG" }
          - { name: AnTuTu,         pkg: "com.antutu.ABenchMark",      label: "BannerHub v6 AnTuTu" }
          - { name: alt-AnTuTu,     pkg: "com.antutu.benchmark.full",  label: "BannerHub v6 AnTuTu" }
          - { name: PuBG-CrossFire, pkg: "com.tencent.tmgp.cf",        label: "BannerHub v6 PuBG CrossFire" }
          - { name: Ludashi,        pkg: "com.ludashi.aibench",        label: "BannerHub v6 Ludashi" }
          - { name: Genshin,        pkg: "com.miHoYo.GenshinImpact",   label: "BannerHub v6 Genshin" }
          - { name: Original,       pkg: "com.xiaoji.egggame",         label: "BannerHub v6" }
    steps:
      - name: Checkout
        # Needed so the apksigner step can read keystore/bannerhub.keystore.
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Apply patches
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          mkdir -p out
          # Values are wrapped in JSON-string quotes so picocli's
          # Map<String,Object> parser doesn't try to coerce them as
          # numbers (e.g. "com.tencent.tmgp.cf" — the trailing 'f' is
          # parsed as a Java float suffix and triggers NumberFormatException
          # before the patch ever runs). The quotes also make values with
          # spaces (e.g. "BannerHub v6 PuBG CrossFire") a non-issue.
          java -jar shared/revanced-cli.jar patch shared/GameHub_6.0.4.apk \
            --patches shared/patches.rvp \
            --bypass-verification \
            -e "Change package name" \
              -O 'packageName="${{ matrix.variant.pkg }}"' \
              -O 'updatePermissions=true' \
              -O 'updateProviders=true' \
            -e "Change app name" -O 'appName="${{ matrix.variant.label }}"' \
            --out "out/${FILENAME}"
          ls -la "out/${FILENAME}"

      - name: Re-sign with BannerHub test key (v1+v2+v3)
        # Replaces revanced-cli's per-run ephemeral signature with the
        # checked-in BannerHub test keystore so the signing cert is stable
        # across releases. v1+v2+v3 enabled for maximum device coverage;
        # v4 disabled (would need a sidecar .idsig sibling for each APK).
        # Cert SHA-256 is printed to logs so we can eyeball-confirm the
        # cert never changed between runs (= in-place updates guaranteed).
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          echo "Using apksigner at ${APKSIGNER}"
          "${APKSIGNER}" sign \
            --ks keystore/bannerhub.keystore \
            --ks-pass pass:bannerhub \
            --ks-key-alias bannerhub \
            --key-pass pass:bannerhub \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "out/${FILENAME}"
          echo "=== signature verification ==="
          "${APKSIGNER}" verify --print-certs "out/${FILENAME}"

      - name: Upload variant APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant.name }}
          path: out/BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
          # 14 days so prerelease APKs are downloadable for testing
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, patch]
    # Only runs when explicitly opted in via workflow_dispatch with stable=true.
    # Every other trigger (tag push, workflow_dispatch with stable=false) ends
    # at the patch matrix and leaves the APKs as Actions artifacts.
    if: github.event_name == 'workflow_dispatch' && inputs.stable == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download shared artifacts (rvp + rve)
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Download all variant APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: apks/
          merge-multiple: true

      - name: List release files
        run: |
          echo "=== APKs ==="
          ls -la apks/
          echo "=== rvp ==="
          ls -la shared/*.rvp 2>/dev/null || true
          echo "=== rve ==="
          ls -la shared/rve/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: BannerHub v6 ${{ needs.build.outputs.version }}
          # Slim release-notes template (default since v1.3.0-604). Each stable: refresh the
          # "What's new in ..." bullets + the "On top of vX.Y.Z-604" prior-stable line below.
          body: |
            ## BannerHub v6 ${{ needs.build.outputs.version }}

            A patched build of **XiaoJi GameHub 6.0.4** that removes the login requirement (import and play games with no account) and redirects the catalog to the BannerHub Cloudflare Worker. Ships **9 variants that install side-by-side**, each with an optional **Lite** build (~34.5 MB / ≈32% smaller).

            **18 APKs attached** — 9 full + 9 Lite. Steam game launches work end-to-end.

            🔒 **Privacy-hardened** — upstream telemetry/analytics channels stripped at the bytecode level. Full list of killed channels (and the honest leftovers) in [`PRIVACY.md`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/PRIVACY.md).

            <details>
            <summary><strong>✨ Everything BannerHub v6 offers (click to expand)</strong></summary>

            - **No login required** — launch straight to the home screen and import/play games without a XiaoJi account.
            - **Custom catalog API** — the catalog is redirected to the BannerHub Cloudflare Worker for **curated component delivery** (hand-picked DXVK, VKD3D-Proton, Box64, FEX, Mesa Turnip driver builds, etc.) instead of the stock upstream set.
            - **Privacy-hardened** — upstream telemetry/analytics channels stripped at the bytecode level (see the `PRIVACY.md` link above for the full list).
            - **PC-accurate controller vibration** — real XInput rumble routed into Android's VibratorManager with independent dual-motor support, configurable **per-game** (mode + intensity) via the **PC Vibration Settings** menu row. Preload-free — no `libevshim` / `LD_PRELOAD`.
            - **9 side-by-side variants** — different package names + launcher labels so multiple builds coexist on one device (`Original` replaces stock GameHub; the rest install alongside it).
            - **Optional Lite builds** — a ~34.5 MB-smaller counterpart of every variant.
            - **Muted UI sounds** — menu/button click sounds silenced; in-game audio untouched.
            - **Root-free file manager access** — a content provider lets MT Manager and similar apps browse GameHub's data dir without root.
            - **Portrait PC-settings** — per-game PC settings render in both landscape and portrait (side benefit of the API redirect).
            - **Installs in place** — stable signing keystore; future BannerHub v6 stables upgrade without uninstalling.
            - **BannerHub v6 branding** — custom app icon, Wine container header, and auth/splash artwork.
            - **Triage-friendly** — debuggable build with logcat markers along the import path.

            </details>

            ### What's new in ${{ needs.build.outputs.version }}

            On top of `v1.2.0-604` (same keystore — installs in place):

            - **🎮 Preload-free vibration — fixes the x86_64 / Box64 launch crash.** PC-accurate XInput rumble no longer ships `libevshim.so` or touches `LD_PRELOAD`; SDL2's ~1 s auto-stop is now defeated by an on-disk `winebus.so` patch instead. This resolves the `c000007b` crash that blocked x86_64 / Box64 game launches on older builds. Rumble behaviour is unchanged (per-game via **PC Vibration Settings**). Device-confirmed.
            - **🪶 Lite builds for every variant.** Each Lite APK is ~34.5 MB smaller (≈114.5 → ≈78.3 MB) — it strips a dead duplicate font, the Aliyun carrier-login lib, the Haima cloud-gaming stack, and the bundled AVIF/HEIC codecs. Removed: cloud gaming (non-functional under the catalog redirect anyway) and the bundled AVIF/HEIC decoder (Android still renders these via the platform decoder; JPEG/PNG/WebP unaffected). Otherwise byte-identical to the full build. Strip-by-strip breakdown in [`bannerhub-v6-lite.md`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/bannerhub-v6-lite.md).

            ### Variants

            Each variant has its own package name + launcher label, so the variants install **side-by-side** with each other. `Original` replaces an installed GameHub; the rest install alongside it.

            **Full vs Lite:** a Lite APK shares its full counterpart's package name and cert — installing Lite **replaces** the matching full build (and vice versa). They do **not** coexist; pick one per row.

            | Variant | Package | Full APK / Lite APK |
            | --- | --- | --- |
            | Normal | `banner.hub` | `…-Normal.apk` / `…-Normal-Lite.apk` |
            | Normal-GHL | `gamehub.lite` | `…-Normal-GHL.apk` / `…-Normal-GHL-Lite.apk` |
            | PuBG | `com.tencent.ig` | `…-PuBG.apk` / `…-PuBG-Lite.apk` |
            | AnTuTu | `com.antutu.ABenchMark` | `…-AnTuTu.apk` / `…-AnTuTu-Lite.apk` |
            | alt-AnTuTu | `com.antutu.benchmark.full` | `…-alt-AnTuTu.apk` / `…-alt-AnTuTu-Lite.apk` |
            | PuBG-CrossFire | `com.tencent.tmgp.cf` | `…-PuBG-CrossFire.apk` / `…-PuBG-CrossFire-Lite.apk` |
            | Ludashi | `com.ludashi.aibench` | `…-Ludashi.apk` / `…-Ludashi-Lite.apk` |
            | Genshin | `com.miHoYo.GenshinImpact` | `…-Genshin.apk` / `…-Genshin-Lite.apk` |
            | Original | `com.xiaoji.egggame` | `…-Original.apk` / `…-Original-Lite.apk` |

            Filenames follow `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-{variant}[-Lite].apk`. The version string is `BannerHub v6` (product) + `1.3.0` (our semver) + `-604` (the GameHub base, `6.0.4`).

            ### Install notes

            - **Signing**: stable BannerHub test keystore. A one-time uninstall is only needed if upgrading from `v1.0.0-604` or older (cert changed then); every release since installs in place. Fingerprints in [`keystore/README.md`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/keystore/README.md).
            - Base APK is unmodified XiaoJi GameHub 6.0.4 (versionCode 114) — only the bytecode/resources the patches need are touched.
            - The `.rvp` / `.rve` bundles are attached for use with `revanced-cli` directly. Built with ReVanced CLI 6.0.0; full APKs from `gamehub-604-build`, Lite from `feature/lite-variant-tier1`.

            <details>
            <summary><strong>📦 Patches applied (click to expand)</strong></summary>

            | Patch | What it does |
            | --- | --- |
            | **Bypass login** | Launch straight to the home screen; import and play games with no account. |
            | **Disable Firebase Crashlytics** | Prevents a launch-time `VerifyError` crash. |
            | **Debug logging** | Debuggable APK + logcat markers along the import path for triage. |
            | **File manager access** | Content provider so external file managers (MT Manager etc.) can browse the data dir without root. |
            | **Rewrite custom permissions per variant** | Stops two installed variants colliding on Android 7+. |
            | **Mute UI sounds** | Silences menu/button clicks; game audio untouched. |
            | **Redirect catalog API** | Points the catalog at the BannerHub Worker; also fixes PC-settings rendering in portrait. |
            | **Prefix API path with /v6** | Lets the Worker serve 6.0-only responses without affecting 5.x clients. |
            | **Offline component cache fallback** ⚠ *broken on 6.0.4* | Online behaviour unaffected; offline pickers just fall back to built-in versions. Safe to ignore unless you rely on offline picker contents. |
            | **PC-accurate vibration** | Routes XInput rumble into Android's VibratorManager (independent dual-motor). Preload-free: an on-disk `winebus.so` patch defeats SDL2's ~1 s auto-stop with no `libevshim.so` / `LD_PRELOAD` (fixes the x86_64/box64 launch-death). Default on at 100%. |
            | **PC Vibration Settings (activity + menu row)** | Per-game mode (off / device / controller / both) and intensity (0–100%), plus a **PC Vibration Settings** row in both per-game popups. |
            | **Change app icon** | BannerHub v6 branding — adaptive icon, Wine container header, auth/splash assets. |
            | **Change package & app name** *(per variant)* | Per-variant package + launcher label so all 9 variants install side-by-side (`Original` keeps `com.xiaoji.egggame`). |
            | **Lite size-reduction strips** *(Lite only)* | Strips the dead 20 MB font, Aliyun carrier-login lib, Haima cloud-gaming stack, and AVIF/HEIC codecs. ~34.5 MB smaller; no effect on full variants. |

            *Per-patch mechanics, smali anchors, and version-by-version letter maps are in the [README's Patches applied section](https://github.com/${{ github.repository }}/blob/gamehub-604-build/README.md#patches-applied) and the [patch sources](https://github.com/${{ github.repository }}/tree/gamehub-604-build/patches/src/main/kotlin/app/revanced/patches/gamehub).*

            </details>

            ### Credits

            PC-accurate controller vibration (including the preload-free rework) is built on **[TideGear](https://github.com/TideGear)**'s [GameHub-Vibration-Fix](https://github.com/TideGear/GameHub-Vibration-Fix) (PR #80 + PR #91), adapted with explicit permission, deriving from [GameNative](https://github.com/utkarshdalal/GameNative) (PR #1214). Full project credits (DXVK, VKD3D-Proton, Box64, FEX, Mesa Turnip, ReVanced, etc.) are in the [README Credits section](https://github.com/${{ github.repository }}/blob/gamehub-604-build/README.md#credits).
          files: |
            apks/BannerHub-V6-*.apk
            shared/*.rvp
            shared/rve/*.rve
