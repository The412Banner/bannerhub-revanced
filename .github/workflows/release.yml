name: Release

# Default mode is "prerelease" — every tag push (or workflow_dispatch run)
# produces the 9 variant APKs as Actions artifacts only. To cut a stable
# GitHub Release, run the workflow manually via Actions → Run workflow with
# the `stable` checkbox ticked. Tag-push triggers always run in prerelease
# (artifacts-only) mode.
#
# Version is derived in the build job's "Derive version" step:
#   - workflow_dispatch: from inputs.version (e.g. "1.1.0-604-pre1")
#   - push: tags: from GITHUB_REF_NAME stripped of leading "v"
# All downstream jobs reference needs.build.outputs.version (no leading "v")
# and needs.build.outputs.tag ("v" + version).
on:
  push:
    tags:
      - "v*"
      - "GameHub-*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for APK filenames + release tag (e.g. "1.1.0-604-pre1" or "1.1.0-604"). Strip leading v; the workflow re-adds it for the git tag. Required for workflow_dispatch.'
        required: false
      stable:
        description: "Cut a stable GitHub Release (default: artifact-only prerelease). Stable requires version to be set."
        type: boolean
        default: false

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        # Single source of truth for the version string used in APK filenames
        # AND the GitHub release tag. Stripped of any leading "v" so the patch
        # job can interpolate it directly into "BannerHub-V6-${version}-…".
        # The release job re-adds "v" when creating the git tag.
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
            if [ -z "$RAW" ]; then
              echo "::error::version input is required for workflow_dispatch. Example: 1.1.0-604-pre1"
              exit 1
            fi
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version=${VERSION} tag=v${VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      # libevshim.so build step removed — the vibration patch is now
      # preload-free (in-process winebus.so disk patch via
      # BhVibrationController.ensureWinebusDurationPatchOnce). No native
      # shim is built or shipped; nothing is added to LD_PRELOAD.

      - name: Build patches bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Download ReVanced CLI
        run: |
          curl -L https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar

      - name: Download base GameHub APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download base-apk-604 \
            --pattern "GameHub_6.0.4.apk" \
            --repo ${{ github.repository }} \
            --output GameHub_6.0.4.apk

      - name: Stage shared artifacts
        run: |
          mkdir -p shared
          cp revanced-cli.jar shared/
          cp GameHub_6.0.4.apk shared/
          cp $(find patches/build/libs -name "*.rvp" ! -name "*-javadoc*" ! -name "*-sources*" | head -1) shared/patches.rvp
          # Side-channel artefacts that ship in the final release
          cp patches/build/libs/*.rvp shared/ 2>/dev/null || true
          mkdir -p shared/rve
          find extensions/extension/build/libs -name "*.rve" -exec cp {} shared/rve/ \; 2>/dev/null || true

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/
          retention-days: 1

  patch:
    name: Patch ${{ matrix.variant.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # THIS IS THE LITE PARALLEL BRANCH (feature/lite-variant-tier1).
        # It is intentionally NOT merged into gamehub-604-build. gamehub-604-build
        # owns the canonical 9 full variants + the GitHub Release; this branch
        # builds a Lite counterpart of each of those 9 and is kept separate so
        # Lite-specific regressions never touch the full set.
        #
        # Every row carries the 4 Tier-1–4 strip patches via `extra` (they are
        # use=false patches, so they only apply because each row -e names them).
        # `pkg` mirrors the matching full variant on gamehub-604-build exactly
        # (Option 2: a Lite APK installs over — i.e. replaces — its full sibling;
        # they do not coexist). `label` is the full variant's label + " Lite".
        # `name` carries a -Lite suffix so the APK filename and the Actions
        # artifact (apk-<name>) never collide with the full set.
        #
        # The `release` job stays gated on workflow_dispatch + stable==true, so
        # dispatching this branch without stable=true ends at the patch matrix
        # and leaves all 9 Lite APKs as Actions artifacts. Those are then
        # manually attached to the gamehub-604-build release.
        variant:
          - { name: Normal-Lite,         pkg: "banner.hub",                 label: "BannerHub v6 Lite",                extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: Normal-GHL-Lite,     pkg: "gamehub.lite",               label: "BannerHub v6 Lite",                extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: PuBG-Lite,           pkg: "com.tencent.ig",             label: "BannerHub v6 PuBG Lite",           extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: AnTuTu-Lite,         pkg: "com.antutu.ABenchMark",      label: "BannerHub v6 AnTuTu Lite",         extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: alt-AnTuTu-Lite,     pkg: "com.antutu.benchmark.full",  label: "BannerHub v6 AnTuTu Lite",         extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: PuBG-CrossFire-Lite, pkg: "com.tencent.tmgp.cf",        label: "BannerHub v6 PuBG CrossFire Lite", extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: Ludashi-Lite,        pkg: "com.ludashi.aibench",        label: "BannerHub v6 Ludashi Lite",        extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: Genshin-Lite,        pkg: "com.miHoYo.GenshinImpact",   label: "BannerHub v6 Genshin Lite",        extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
          - { name: Original-Lite,       pkg: "com.xiaoji.egggame",         label: "BannerHub v6 Lite",                extra: '-e "Strip duplicate font" -e "Disable Aliyun NumberAuth" -e "Strip cloud gaming" -e "Strip AVIF/HEIC codecs"' }
    steps:
      - name: Checkout
        # Needed so the apksigner step can read keystore/bannerhub.keystore.
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Apply patches
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          mkdir -p out
          # Values are wrapped in JSON-string quotes so picocli's
          # Map<String,Object> parser doesn't try to coerce them as
          # numbers (e.g. "com.tencent.tmgp.cf" — the trailing 'f' is
          # parsed as a Java float suffix and triggers NumberFormatException
          # before the patch ever runs). The quotes also make values with
          # spaces (e.g. "BannerHub v6 PuBG CrossFire") a non-issue.
          java -jar shared/revanced-cli.jar patch shared/GameHub_6.0.4.apk \
            --patches shared/patches.rvp \
            --bypass-verification \
            ${{ matrix.variant.extra }} \
            -e "Change package name" \
              -O 'packageName="${{ matrix.variant.pkg }}"' \
              -O 'updatePermissions=true' \
              -O 'updateProviders=true' \
            -e "Change app name" -O 'appName="${{ matrix.variant.label }}"' \
            --out "out/${FILENAME}"
          ls -la "out/${FILENAME}"

      - name: Re-sign with BannerHub test key (v1+v2+v3)
        # Replaces revanced-cli's per-run ephemeral signature with the
        # checked-in BannerHub test keystore so the signing cert is stable
        # across releases. v1+v2+v3 enabled for maximum device coverage;
        # v4 disabled (would need a sidecar .idsig sibling for each APK).
        # Cert SHA-256 is printed to logs so we can eyeball-confirm the
        # cert never changed between runs (= in-place updates guaranteed).
        env:
          FILENAME: BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          echo "Using apksigner at ${APKSIGNER}"
          "${APKSIGNER}" sign \
            --ks keystore/bannerhub.keystore \
            --ks-pass pass:bannerhub \
            --ks-key-alias bannerhub \
            --key-pass pass:bannerhub \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "out/${FILENAME}"
          echo "=== signature verification ==="
          "${APKSIGNER}" verify --print-certs "out/${FILENAME}"

      - name: Upload variant APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant.name }}
          path: out/BannerHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
          # 14 days so prerelease APKs are downloadable for testing
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, patch]
    # Only runs when explicitly opted in via workflow_dispatch with stable=true.
    # Every other trigger (tag push, workflow_dispatch with stable=false) ends
    # at the patch matrix and leaves the APKs as Actions artifacts.
    if: github.event_name == 'workflow_dispatch' && inputs.stable == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download shared artifacts (rvp + rve)
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Download all variant APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: apks/
          merge-multiple: true

      - name: List release files
        run: |
          echo "=== APKs ==="
          ls -la apks/
          echo "=== rvp ==="
          ls -la shared/*.rvp 2>/dev/null || true
          echo "=== rve ==="
          ls -la shared/rve/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: BannerHub v6 ${{ needs.build.outputs.version }}
          body: |
            ## BannerHub v6 ${{ needs.build.outputs.version }}

            A patched build of XiaoJi GameHub 6.0.4 (`com.xiaoji.egggame`, versionCode 114) that removes the login requirement so games can be imported and used without an account, redirects the catalog API to the BannerHub Cloudflare Worker, and ships **9 variants that install side-by-side on the same device**.

            ### ✨ What's new in 1.1.0-604

            This is the **first BannerHub v6 stable** on the new build pipeline. Compared to `v1.0.0-604`, this release ships four major changes:

            - **🎮 PC-accurate XInput rumble for Wine games.** Ported from [TideGear/GameHub-Vibration-Fix](https://github.com/TideGear/GameHub-Vibration-Fix) (GameNative PR #1214 lineage) with the author's permission. Dual-motor independent dispatch on multi-motor controllers, sustained rumble that persists past SDL2's ~1 s auto-stop (**preload-free**: an in-process hook patches every `winebus.so` on disk so SDL2's `rumble_expiration` never fires — no `libevshim.so`, no `LD_PRELOAD`, no extra mapping in the Wine subprocess, so x86_64/box64 game launches are no longer destabilised), and instant release on let-go. **On by default** — `MODE_CONTROLLER` at 100% intensity. Adjust per-game via the new **PC Vibration Settings** menu entry (see below).
            - **🎛 PC Vibration Settings menu row in both per-game popups.** A new 5th row labelled **PC Vibration Settings** now appears in (1) the game-details "More Menu" (3-dot from inside a game's detail screen) and (2) the library-tile 3-dot popup. Tapping it opens a per-game mode/intensity dialog (off / device / controller / both). Per-game settings persist; global defaults apply to games without per-game overrides.
            - **🎨 BannerHub v6 visual rebrand.** New launcher icon (adaptive-icon foreground, masked-shape friendly on every launcher), refreshed in-app `wine_logo`, and rebranded auth-screen + splash-screen banners. Five drawables touched; per-variant package names + side-by-side install behaviour unchanged.
            - **🔐 Stable signing — in-place updates from now on.** This release is the first one signed with a stable test keystore (cert SHA-256 `10:89:5A:31:1F:E0:4F:95:F8:2E:4D:A5:C9:A6:C0:41:BA:92:82:BF:21:1F:1B:57:8F:E1:CB:EB:89:4C:E0:BA`). Future BannerHub v6 stables update in-place — no more uninstall-between-versions. **One-time migration required** if you're on `v1.0.0-604` or older (different cert) — see the migration note below.

            ### 🔐 Stable signing — in-place updates from this release onward

            BannerHub releases are now signed with a **stable test keystore** ([`keystore/bannerhub.keystore`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/keystore/README.md)) instead of a fresh per-run ephemeral key. From this release forward, every future BannerHub v6 stable installs **on top of the previous one** with no uninstall — Android sees them as the same app.

            **One-time migration from any earlier `v1.0.0-604`-or-older release:** the old builds were signed with revanced-cli's per-run ephemeral key, so the cert differs. Uninstall your current BannerHub-ReVanced variant once, then install the matching variant from this release. From here on out you can update in place.

            Cert fingerprints (SHA-256 / SHA-1) are documented in [`keystore/README.md`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/keystore/README.md) and printed in every CI run's `apksigner verify --print-certs` log lines so you can cross-check.

            ### ✅ Steam game launches work end-to-end

            v1.0.0-602's release notes carried a warning that the **standard Steam client** wouldn't launch games under the BannerHub catalog redirect — the workaround was to switch to the **Lightweight Steam client** in the per-game settings. **That warning no longer applies.** The BannerHub API Worker has been fixed server-side to serve a Steam-launch-compatible payload for both client variants, so the standard Steam client launches games successfully on this build (and on existing patched builds — the fix is server-side and retroactive). Pick whichever Steam client suits your title; both work.

            > ⚠ **If your first Steam launch errors with `xtask install components failed`:** open that game's **PC game settings**, set the components manually (Wine prefix, DXVK, VKD3D, container, etc.) and — most importantly — make sure the **correct Steam client** is selected, then try to launch again. The error is a one-time setup hiccup on the first launch when components haven't been pinned per-game yet; once the per-game settings are filled in the launch succeeds.

            ### Source
            - **Base APK**: `GameHub_6.0.4.apk` — the official 6.0.4 global build (versionCode 114), attached unmodified to [`base-apk-604`](https://github.com/${{ github.repository }}/releases/tag/base-apk-604).
            - **Patcher**: ReVanced CLI 6.0.0 + this repo's patch bundle, branch `gamehub-604-build`.
            - **Catalog backend**: [`The412Banner/bannerhub-api`](https://github.com/The412Banner/bannerhub-api) — Cloudflare Worker, deployed at `bannerhub-api.the412banner.workers.dev`.
            - **Repo**: https://github.com/${{ github.repository }}

            #### Naming & versioning scheme

            APK files follow the pattern **`BannerHub-V6-{version}-Patched-{variant}.apk`** — e.g. `BannerHub-V6-1.1.0-604-Patched-Normal.apk`. The version string itself has three parts:

            - **BannerHub v6** — product name. The `v6` is fixed; it's our branch family aligned with GameHub's 6.x series and stays put across upstream patch-version bumps.
            - **`1.1.0`** — BannerHub-side semver (`major.minor.patch`). Tracks our own changes: new patches, infrastructure work, bug fixes. Bumps on every release.
            - **`-604`** — GameHub base version with the dots stripped (`6.0.4` → `604`). Tells you which upstream GameHub APK was patched. When GameHub upstream releases `6.0.5`, the suffix becomes `-605` and the same patch set can be retargeted (e.g. `v1.1.0-605`) without otherwise changing.

            The release tag (`v1.1.0-604`) is just the version string with a leading `v`. The `{variant}` slot in the filename identifies which of the 9 side-by-side packagings you grabbed.

            ### Variants

            This is the **Lite** parallel branch (`feature/lite-variant-tier1`). It produces 9 Lite APKs — a Lite counterpart of each of the 9 full variants built by `gamehub-604-build`. Every Lite APK strips a verified-dead duplicate 20 MB font, the Aliyun carrier-login native lib, the Haima cloud-gaming stack, and the avif-coil AVIF/HEIC image-codec stack (~34.5 MB smaller on disk, ≈32%: 114.5 → 78.3 MB). Removed features: cloud gaming (non-functional under the BannerHub catalog redirect anyway) and the bundled AVIF/HEIC decoder — modern Android still renders HEIF/AVIF via the platform decoder, JPEG/PNG/WebP unaffected. Each Lite APK uses the **same package name** as its full counterpart, so installing a Lite APK **replaces** the matching full variant (they do not coexist); only the launcher label differs (full label + " Lite"). These Lite APKs are normally built artifact-only and manually attached to the `gamehub-604-build` release alongside the 9 full APKs.

            | Variant | APK | Package | Launcher label |
            | --- | --- | --- | --- |
            | Normal-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Normal-Lite.apk` | `banner.hub` | BannerHub v6 Lite |
            | Normal-GHL-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Normal-GHL-Lite.apk` | `gamehub.lite` | BannerHub v6 Lite |
            | PuBG-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-PuBG-Lite.apk` | `com.tencent.ig` | BannerHub v6 PuBG Lite |
            | AnTuTu-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-AnTuTu-Lite.apk` | `com.antutu.ABenchMark` | BannerHub v6 AnTuTu Lite |
            | alt-AnTuTu-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-alt-AnTuTu-Lite.apk` | `com.antutu.benchmark.full` | BannerHub v6 AnTuTu Lite |
            | PuBG-CrossFire-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-PuBG-CrossFire-Lite.apk` | `com.tencent.tmgp.cf` | BannerHub v6 PuBG CrossFire Lite |
            | Ludashi-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Ludashi-Lite.apk` | `com.ludashi.aibench` | BannerHub v6 Ludashi Lite |
            | Genshin-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Genshin-Lite.apk` | `com.miHoYo.GenshinImpact` | BannerHub v6 Genshin Lite |
            | Original-Lite | `BannerHub-V6-${{ needs.build.outputs.version }}-Patched-Original-Lite.apk` | `com.xiaoji.egggame` | BannerHub v6 Lite |

            <details>
            <summary><strong>📦 Patches applied (click to expand)</strong></summary>

            | Patch | What it does |
            | --- | --- |
            | **Bypass login** | Lets you launch straight into the home screen and import games without an account. |
            | **Disable Firebase Crashlytics** | Removes the Crashlytics init block so the patched build doesn't crash on launch with `VerifyError`. |
            | **Debug logging** | Marks the APK debuggable and adds logcat markers along the import code path for triage. |
            | **File manager access** | Exposes a content provider so external file managers (MT Manager etc.) can browse GameHub's data dir without root. |
            | **Rewrite custom permissions per variant** | Per-variant `com.xiaoji.egggame.permission.*` rewrite so two installed variants don't collide on Android 7+. |
            | **Mute UI sounds** | Replaces the bundled menu/button click sounds with silent PCM. Game audio is untouched. |
            | **Redirect catalog API** | Points the catalog API at the BannerHub Cloudflare Worker (`bannerhub-api.the412banner.workers.dev`) for curated component delivery. Side benefit: per-game PC settings now render in both landscape and portrait. |
            | **Prefix API path with /v6** | Prepends `v6/` to every relative API call so the Worker can serve 6.0-only response variants without affecting 5.x clients. |
            | **Offline component cache fallback** ⚠ *currently broken on 6.0.4* | *Intended to let per-game pickers show your cached components when the device is offline.* Online behavior is unchanged, so this caveat only matters when you're offline — pickers will still show only the embedded built-in versions instead of the cached entries the patch was meant to surface. Investigation pending; safe to ignore unless you specifically rely on offline picker contents. |
            | **PC-accurate vibration** ⭐ *new in 1.1.0-604* | 4 bytecode hooks (GamepadServerManager.onRumble entry + per-controller dispatch + stop + Wine env-builder pre-launch trigger) route XInput rumble into Android's VibratorManager with dual-motor independent dispatch on multi-motor pads. SDL2's ~1 s auto-stop is defeated **preload-free**: `BhVibrationController.ensureWinebusDurationPatchOnce` rewrites every `winebus.so`'s two non-zero `SDL_JoystickRumble` duration loads to `0xffffffff` on disk (aarch64 + x86_64) once per app process — no `libevshim.so`, no `LD_PRELOAD`, no extra mapping in the Wine subprocess (fixes the x86_64/box64 launch-death regression). Defaults to `MODE_CONTROLLER` at 100% intensity — works out of the box. |
            | **Vibration settings activity** ⭐ *new in 1.1.0-604* | Registers `com.xj.winemu.vibration.BhVibrationSettingsActivity` in the manifest. Internal-only (exported=false); launched by the menu rows below via explicit Intent. Dialog lets you pick mode (off / device / controller / both) and intensity (0–100%) per-game, with global defaults. |
            | **PC Vibration Settings menu row** ⭐ *new in 1.1.0-604* | Injects a 5th menu row labelled **PC Vibration Settings** into both per-game popups (game-details "More Menu" + library-tile 3-dot popup). Tapping launches the vibration settings dialog scoped to the active game. Survives Compose Multiplatform's R8-renamed `Function0/Function1` interfaces (proxied at runtime) and the empty-Kotlin-subclass `Lell` resource descriptor (allocated via `Unsafe`). |
            | **PC Vibration Settings label resource** ⭐ *new in 1.1.0-604* | Appends a `bh_pc_vibration_label = "PC Vibration Settings"` entry to `features.home`'s Compose Multiplatform resource bundle (`.cvr` file). Used as documentation; the actual runtime resolution goes via a bytecode-patched short-circuit in `Lxd3.l1` because Compose's resource manifest needs entries the bare `.cvr` doesn't register. |
            | **Change app icon** ⭐ *new in 1.1.0-604* | Replaces 5 in-APK drawables with BannerHub v6 branding: adaptive-icon foreground (deletes the stock GameHub vector so the new raster wins on every device density), in-app `wine_logo` (Wine container header), and three Compose Multiplatform auth/splash assets (auth-screen landscape + overseas logos + splash banner). Launcher background drawable left as-is so launcher masking applies cleanly. |
            | **Change package name** *(per variant)* | Renames the APK package per variant so all 9 variants install side-by-side. The `Original` variant keeps `com.xiaoji.egggame`. |
            | **Change app name** *(per variant)* | Renames the launcher label per variant. |

            *Per-patch mechanics, smali edits, structural anchors, and version-by-version letter maps live in the [README's Patches applied section](https://github.com/${{ github.repository }}/blob/gamehub-604-build/README.md#patches-applied) and the patch source comments under [`patches/src/main/kotlin/app/revanced/patches/gamehub/`](https://github.com/${{ github.repository }}/tree/gamehub-604-build/patches/src/main/kotlin/app/revanced/patches/gamehub).*

            </details>

            ### Notes

            - The base APK is unmodified XiaoJi GameHub 6.0.4; only the bytecode/resources required by the patches above are touched.
            - **Signing**: signed with the stable BannerHub test keystore (`keystore/bannerhub.keystore`). One-time uninstall required if upgrading from `v1.0.0-604` or older (different cert). From this release onward, all future BannerHub v6 stables install in place. Cert fingerprints: see [`keystore/README.md`](https://github.com/${{ github.repository }}/blob/gamehub-604-build/keystore/README.md).
