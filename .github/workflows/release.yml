name: Release

# Default mode is "prerelease" — every tag push (or workflow_dispatch run)
# produces the 9 variant APKs as Actions artifacts only. To cut a stable
# GitHub Release, run the workflow manually via Actions → Run workflow with
# the `stable` checkbox ticked. Tag-push triggers always run in prerelease
# (artifacts-only) mode.
on:
  push:
    tags:
      - "v*"
      - "GameHub-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0 or GameHub-6.0). Required when stable=true."
        required: false
      stable:
        description: "Cut a stable GitHub Release (default: artifact-only prerelease)"
        type: boolean
        default: false

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build patches bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Download ReVanced CLI
        run: |
          curl -L https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar

      - name: Download base GameHub APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download base-apk-604 \
            --pattern "GameHub_6.0.4.apk" \
            --repo ${{ github.repository }} \
            --output GameHub_6.0.4.apk

      - name: Stage shared artifacts
        run: |
          mkdir -p shared
          cp revanced-cli.jar shared/
          cp GameHub_6.0.4.apk shared/
          cp $(find patches/build/libs -name "*.rvp" ! -name "*-javadoc*" ! -name "*-sources*" | head -1) shared/patches.rvp
          # Side-channel artefacts that ship in the final release
          cp patches/build/libs/*.rvp shared/ 2>/dev/null || true
          mkdir -p shared/rve
          find extensions/extension/build/libs -name "*.rve" -exec cp {} shared/rve/ \; 2>/dev/null || true

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/
          retention-days: 1

  patch:
    name: Patch ${{ matrix.variant.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: Normal,         file: "GameHub-6.0.4-Patched-Normal.apk",          pkg: "banner.hub",                 label: "GameHub" }
          - { name: Normal-GHL,     file: "GameHub-6.0.4-Patched-Normal(GHL).apk",     pkg: "gamehub.lite",               label: "GameHub" }
          - { name: PuBG,           file: "GameHub-6.0.4-Patched-PuBG.apk",            pkg: "com.tencent.ig",             label: "GameHub PuBG" }
          - { name: AnTuTu,         file: "GameHub-6.0.4-Patched-AnTuTu.apk",          pkg: "com.antutu.ABenchMark",      label: "GameHub AnTuTu" }
          - { name: alt-AnTuTu,     file: "GameHub-6.0.4-Patched-alt-AnTuTu.apk",      pkg: "com.antutu.benchmark.full",  label: "GameHub AnTuTu" }
          - { name: PuBG-CrossFire, file: "GameHub-6.0.4-Patched-PuBG-CrossFire.apk",  pkg: "com.tencent.tmgp.cf",        label: "GameHub PuBG CrossFire" }
          - { name: Ludashi,        file: "GameHub-6.0.4-Patched-Ludashi.apk",         pkg: "com.ludashi.aibench",        label: "GameHub Ludashi" }
          - { name: Genshin,        file: "GameHub-6.0.4-Patched-Genshin.apk",         pkg: "com.miHoYo.GenshinImpact",   label: "GameHub Genshin" }
          - { name: Original,       file: "GameHub-6.0.4-Patched-Original.apk",        pkg: "com.xiaoji.egggame",         label: "GameHub" }
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Apply patches
        run: |
          set -e
          mkdir -p out
          # Values are wrapped in JSON-string quotes so picocli's
          # Map<String,Object> parser doesn't try to coerce them as
          # numbers (e.g. "com.tencent.tmgp.cf" — the trailing 'f' is
          # parsed as a Java float suffix and triggers NumberFormatException
          # before the patch ever runs). The quotes also make values with
          # spaces (e.g. "GameHub PuBG CrossFire") a non-issue.
          java -jar shared/revanced-cli.jar patch shared/GameHub_6.0.4.apk \
            --patches shared/patches.rvp \
            --bypass-verification \
            -e "Change package name" \
              -O 'packageName="${{ matrix.variant.pkg }}"' \
              -O 'updatePermissions=true' \
              -O 'updateProviders=true' \
            -e "Change app name" -O 'appName="${{ matrix.variant.label }}"' \
            --out "out/${{ matrix.variant.file }}"
          ls -la "out/${{ matrix.variant.file }}"

      - name: Upload variant APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant.name }}
          path: out/${{ matrix.variant.file }}
          # 14 days so prerelease APKs are downloadable for testing
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: patch
    # Only runs when explicitly opted in via workflow_dispatch with stable=true.
    # Every other trigger (tag push, workflow_dispatch with stable=false) ends
    # at the patch matrix and leaves the APKs as Actions artifacts.
    if: github.event_name == 'workflow_dispatch' && inputs.stable == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download shared artifacts (rvp + rve)
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Download all variant APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: apks/
          merge-multiple: true

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: List release files
        run: |
          echo "=== APKs ==="
          ls -la apks/
          echo "=== rvp ==="
          ls -la shared/*.rvp 2>/dev/null || true
          echo "=== rve ==="
          ls -la shared/rve/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Gamehub 6.0.4 - BannerHub API - Patched
          body: |
            ## Gamehub 6.0.4 - BannerHub API - Patched

            A patched build of XiaoJi GameHub 6.0.4 (`com.xiaoji.egggame`, versionCode 114) that removes the login requirement so games can be imported and used without an account, redirects the catalog API to the BannerHub Cloudflare Worker, and ships **9 variants that install side-by-side on the same device**.

            ### 🔄 Base APK refresh from 6.0.2 → 6.0.4

            The 6.0.2 → 6.0.4 minor bump triggered another sweeping R8 letter reshuffle — every class letter the bytecode patches keyed on was reassigned (new r8-map-id `6a5cde6143fc…57b`). All bytecode-keyed patches were re-anchored against 6.0.4 via the structural-anchor recipes recorded in the patch sources; **all 9 variants applied cleanly on the first patcher run** (no .0 → .1 hotfix needed, second consecutive base bump where the structural anchors caught everything first try).

            - **Bypass login** — `AUTH_IMPL` `Lit0;` → `Ljt0;`, `AUTH_INTERFACE` `Lct0;` → `Ldt0;`, `AUTH_TOKEN` `Lkpm;` → `Lwpm;`, `GAME_LIB_REPO` `Luu7;` → `Lvu7;` (its userId-getter still named `e()`), `NAVIGATOR` `Lxle;` → `Lgme;` (Login intent class `Lsa0;` → `Lta0;`; screen-route enum `Lgi0;` → `Lhi0;`). The `FakeStateFlow` reflective wrap now targets the 6.0.4 trio: `STATE_FLOW_IMPL` `tjk` → `akk`, `STATE_FLOW_WRAPPER` `hzh` → `ozh`, `STATE_FLOW_HOLDER_INTERFACE` `vfe` → `dge`; abstract StateFlow interface `Lrjk;` → `Lyjk;`. `FakeAuthToken` and `FakeUserAccount` follow `Lkpm;` → `Lwpm;` and `Lfpm;` → `Lrpm;` respectively (both ctor signatures byte-identical to 6.0.2). **`NAV_INTERCEPTOR` skipped on 6.0.4** — `Liod;->a(...)`'s body no longer holds the iget+invoke+if-nez auth check inline; it constructs a `Lhod;` coroutine continuation and the pattern moved into `Lhod;->invokeSuspend`. The remaining six BypassLogin hooks (StateFlow fakes + navigator gates + user-id getter + token wrapper) cover the user-facing surface — device-tested confirms no login-redirect leak from the skip.
            - **Redirect catalog API** — `ENV_ENUM_CLASS` `Lxrj;` → `Lesj;`. Both Online enum hosts (`landscape-api-cn.vgabc.com`, `landscape-api-oversea.vgabc.com`) still redirect to `bannerhub-api.the412banner.workers.dev`.
            - **Prefix API path with /v6** — `Lvob;->b(Lm7a;String)V` → `Lcpb;->b(Ln7a;String)V`. Same anchor shape (iget on the builder's URL field then a string-trim helper — moved from `Lpll;->s1` to `Lbml;->s1` in the host, but the patch hooks the helper at its head before any of that runs).
            - **Debug logging** — `Li86;` → `Lj86;` (y2d-impl), `Lpgd;` → `Lxgd;` (y2d-interface), `Lmw6;` → `Lnw6;` (Function0), `Luu7;->v` → `Lvu7;->v` (game-import save), `Lyji;` → `Lfki;` (RetroGameDao.upsert wrapper), `Lvs7;` → `Lws7;` (inner Room transaction; `.locals 70` again — closest to the original 6.0.0 `.locals 69`). Probe semantics unchanged.
            - **Offline component cache fallback** — `ECI_CLASS` `Leci;` → `Lmci;`, `CONTINUATION_TYPE` `Lai3;` → `Lci3;`, `KOTLIN_EMPTY_LIST_CLASS` `Lz85;` → `Lw85;`. Same `:goto_2` sget-object swap point; runtime field lookups (`a`, `c`) are still single-letter + type-checked so no extension-side change was needed.
            - **No-touch patches** — Disable Firebase Crashlytics, Mute UI sounds, File manager access, Rewrite custom permissions, Change package name, Change app name — anchored on full Android / Firebase / asset-path / manifest names that R8 doesn't touch, so they apply byte-for-byte without any code change.

            **Migrating from any earlier release:** uninstall the previously-installed BannerHub-ReVanced variant of the same name first — release-to-release the signing keystore changes (CI generates a fresh debug keystore each run), so Android refuses cross-release upgrades with `INSTALL_FAILED_UPDATE_INCOMPATIBLE`. Within v1.0.0-604 itself, all 9 variants share signing and install side-by-side.

            ### ✅ Steam game launches now work end-to-end

            v1.0.0-602's release notes carried a warning that the **standard Steam client** wouldn't launch games under the BannerHub catalog redirect — the workaround was to switch to the **Lightweight Steam client** in the per-game settings. **That warning no longer applies.** The BannerHub API Worker has been fixed server-side to serve a Steam-launch-compatible payload for both client variants, so the standard Steam client launches games successfully on this build (and on existing patched builds — the fix is server-side and retroactive). Pick whichever Steam client suits your title; both work.

            > ⚠ **If your first Steam launch errors with `xtask install components failed`:** open that game's **PC game settings**, set the components manually (Wine prefix, DXVK, VKD3D, container, etc.) and — most importantly — make sure the **correct Steam client** is selected, then try to launch again. The error is a one-time setup hiccup on the first launch when components haven't been pinned per-game yet; once the per-game settings are filled in the launch succeeds.

            ### Source
            - **Base APK**: `GameHub_6.0.4.apk` — the official 6.0.4 global build (versionCode 114), attached unmodified to [`base-apk-604`](https://github.com/${{ github.repository }}/releases/tag/base-apk-604).
            - **Patcher**: ReVanced CLI 6.0.0 + this repo's patch bundle, branch `gamehub-604-build`.
            - **Catalog backend**: [`The412Banner/bannerhub-api`](https://github.com/The412Banner/bannerhub-api) — Cloudflare Worker, deployed at `bannerhub-api.the412banner.workers.dev`.
            - **Repo**: https://github.com/${{ github.repository }}

            ### Variants

            Nine APKs are produced from the same patch bundle, each with a different package name + launcher label so they install side-by-side. The `Original` variant **replaces** an installed GameHub; the rest install **alongside** the original.

            | Variant | APK | Package | Launcher label |
            | --- | --- | --- | --- |
            | Normal | `GameHub-6.0.4-Patched-Normal.apk` | `banner.hub` | GameHub |
            | Normal (GHL) | `GameHub-6.0.4-Patched-Normal(GHL).apk` | `gamehub.lite` | GameHub |
            | PuBG | `GameHub-6.0.4-Patched-PuBG.apk` | `com.tencent.ig` | GameHub PuBG |
            | AnTuTu | `GameHub-6.0.4-Patched-AnTuTu.apk` | `com.antutu.ABenchMark` | GameHub AnTuTu |
            | alt-AnTuTu | `GameHub-6.0.4-Patched-alt-AnTuTu.apk` | `com.antutu.benchmark.full` | GameHub AnTuTu |
            | PuBG-CrossFire | `GameHub-6.0.4-Patched-PuBG-CrossFire.apk` | `com.tencent.tmgp.cf` | GameHub PuBG CrossFire |
            | Ludashi | `GameHub-6.0.4-Patched-Ludashi.apk` | `com.ludashi.aibench` | GameHub Ludashi |
            | Genshin | `GameHub-6.0.4-Patched-Genshin.apk` | `com.miHoYo.GenshinImpact` | GameHub Genshin |
            | Original | `GameHub-6.0.4-Patched-Original.apk` | `com.xiaoji.egggame` | GameHub |

            ### Patches applied

            | Patch | What it does |
            | --- | --- |
            | **Bypass login** | Skips the login screen entirely. Replaces `jt0.h()`'s isLoggedIn StateFlow to emit `TRUE`, replaces `jt0.e()`'s user-account StateFlow to emit a synthetic `rpm{user_id="99999"}` so library queries return rows, replaces `vu7.e()` and `dt0.f()` to keep the user-id consistent across read/write paths, and short-circuits the `gme.i/r` Login navigator gates. (`Liod;` NavigationInterceptor skip — its inline auth check moved into a coroutine continuation in 6.0.4, but the remaining hooks cover the user-facing surface; device-tested.) Result: launches straight into the home screen; game-import saves persist to `db_game_library.db`; imported games appear in the library list. |
            | **Disable Firebase Crashlytics** | Removes the Crashlytics initialisation block in reverse instruction order so the ART verifier accepts the resulting bytecode. Without this, GameHub 6.0 crashes on launch with `VerifyError`. |
            | **Debug logging** | Sets `android:debuggable="true"` and inserts `Log.i("GH600-DEBUG", ...)` markers along the import code path (Save → Room DAO inserts) plus a `Throwable` hook on the global exception swallower. Used to triage the import flow during development; will be removed in a follow-up build once the import flow is confirmed stable. |
            | **File manager access** | Adds an exposed `MTDataFiles` content provider so external file managers can browse GameHub's data directory. The provider authority and wake-up activity `taskAffinity` are derived per-variant from `packageNameOption.value` so two variants don't collide on `INSTALL_FAILED_CONFLICTING_PROVIDER`. |
            | **Rewrite custom permissions per variant** | Iterates the manifest's `<permission>` and `<uses-permission>` elements; any whose name starts `com.xiaoji.egggame.permission.` (notably the Mob Push SDK's `C2D_MESSAGE`) gets the prefix rewritten to the variant package. Without this, Android 7+ rejects the second-installed variant with `INSTALL_FAILED_DUPLICATE_PERMISSION`. |
            | **Mute UI sounds** | Replaces the bundled UI feedback sounds (`assets/.../sound/*.wav`) with silent PCM, so menu navigation and button taps no longer click. The patch substitutes the resource at packaging time — no runtime audio routing is changed. |
            | **Redirect catalog API** | Patches the `esj` environment enum's `Online` value so the catalog API's `cnHost` and `overseaHost` both point at the BannerHub Cloudflare Worker (`bannerhub-api.the412banner.workers.dev`) instead of `landscape-api-{cn,oversea}.vgabc.com`. The Worker serves a curated component catalog from GitHub Pages and forwards unallowlisted paths back to the original upstream with the original signed-request behavior preserved. Beta + Test enum values, the analytics hosts, and the bigeyes CDN are intentionally untouched. **Side benefit:** the per-game **PC game settings** screen now renders correctly in both landscape *and* portrait orientation. Upstream's response constrained the screen to landscape only; the BannerHub Worker's payload doesn't carry that constraint, so the picker is usable from a portrait-held phone. |
            | **Prefix API path with /v6** | Hooks `cpb.b(n7a, String)` — the single Ktor URL-builder chokepoint every relative API call funnels through — and prepends `v6/` to the path. Together with **Redirect catalog API**, this lets the Worker serve 6.0-only response variants (firmware 1.3.7, `base.fileType=0`, the `EnvListData` wrapper required by 6.0's kotlinx-strict deserializer) without affecting 5.x clients, which never carry the prefix. Full URLs (`http://`, `https://`) are passed through untouched so direct downloads still work. |
            | **Offline component cache fallback** | Lets the per-game pickers (GPU driver, DXVK, VKD3D, FEXCore, Box64, container) render cached entries when the device is offline. The empty-list path in `mci.a(RepoCategory, Continuation)` is swapped for a reflective reader that pulls categorised entries out of `xxo.c` (the on-disk-hydrated `ConcurrentHashMap`) instead of returning Kotlin's `EmptyList`. Online behavior is unchanged — the hook only fires when the network-backed flow already returned empty. |
            | **Change package name** *(per variant)* | Rewrites the APK's package name to the variant's value listed above. The `Original` variant keeps `com.xiaoji.egggame`. |
            | **Change app name** *(per variant)* | Rewrites the launcher label to the variant's value listed above. |

            ### Notes

            - The base APK is unmodified XiaoJi GameHub 6.0.4; only the bytecode/resources required by the patches above are touched.
            - **A fresh install is required if a previous release is still installed.** Each release run generates a new debug keystore, so the signing certificate differs between releases and Android refuses the upgrade with `INSTALL_FAILED_UPDATE_INCOMPATIBLE` (signature mismatch). Uninstall the previous version of the same variant first, then install the new one. Within a single release, all 9 variants are signed with the same cert.
            - Cover-art-on-import was fixed server-side in the BannerHub Worker on 2026-05-11 (worker deploy `5fd6c6a7…`) and applies retroactively to every existing patched build — no APK rebuild needed.
            - The `.rvp` patch bundle and `.rve` extension files are also attached for use with `revanced-cli` directly.
          files: |
            apks/GameHub-6.0.4-Patched-*.apk
            shared/*.rvp
            shared/rve/*.rve
